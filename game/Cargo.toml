[package]
name = "pixel-gun-3d-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = "0.7"
bevy = { version = "0.19.1", features = ["wav"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rfd = "0.17.2"

# Fast enough to play while developing: optimise dependencies (Bevy) fully,
# our own code lightly so it still compiles quickly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# the release downloads: no debug symbols (they doubled the program's size)
[profile.release]
strip = true
