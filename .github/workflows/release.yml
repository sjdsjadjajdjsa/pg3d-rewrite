name: release

# Push a tag like v0.1.0 and this builds the game for Linux and Windows and puts the
# downloads on the GitHub release for that tag. The tag must match the version in
# game/Cargo.toml. Each download holds the game, the exporter and a Python to run it with
# (python-build-standalone), so players need nothing but Pixel Gun 3D from Steam.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PYTHON: "3.13.18+20261026"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported Ubuntu LTS so the game runs on any distribution
          # with glibc 2.35 or newer.
          - os: ubuntu-24.04
            container: ubuntu:22.04
            python: x86_64-unknown-linux-gnu
            assets: pg3d-rewrite-linux-x86_64.tar.gz
          - os: windows-latest
            python: x86_64-pc-windows-msvc
            assets: |
              pg3d-rewrite-setup-x86_64.exe
              pg3d-rewrite-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: System libraries
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            game
            exporter/helpers/bc6h-decode
      - name: Check the tag against game/Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' game/Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG but game/Cargo.toml says $version"
            exit 1
          fi
      - name: Build
        shell: bash
        run: |
          cargo build --release --manifest-path game/Cargo.toml
          cargo build --release --manifest-path exporter/helpers/bc6h-decode/Cargo.toml
      - name: Assemble
        shell: bash
        run: |
          out=dist/pg3d-rewrite
          ex=$out/exporter
          mkdir -p $ex/helpers/bc6h-decode/target/release
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=.exe
          cp game/target/release/pixel-gun-3d-rs$exe $out/pg3d-rewrite$exe
          cp README.md LICENSE $out/
          cp -r exporter/scripts $ex/
          cp exporter/layouts.json exporter/sound_names.json exporter/effects_table.json exporter/requirements.txt exporter/README.md $ex/
          cp exporter/helpers/bc6h-decode/target/release/bc6h-decode$exe $ex/helpers/bc6h-decode/target/release/
          curl -fsSL -o python.tar.gz "https://github.com/astral-sh/python-build-standalone/releases/download/${PYTHON#*+}/cpython-${PYTHON}-${{ matrix.python }}-install_only_stripped.tar.gz"
          tar xzf python.tar.gz -C $ex
      - name: Pack (Linux)
        if: runner.os == 'Linux'
        run: tar czf pg3d-rewrite-linux-x86_64.tar.gz -C dist pg3d-rewrite
      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/pg3d-rewrite -DestinationPath pg3d-rewrite-windows-x86_64.zip
          $version = $env:TAG.TrimStart("v")
          iscc /Q "/DVersion=$version" "/DSource=$env:GITHUB_WORKSPACE\dist\pg3d-rewrite" packaging\windows\pg3d-rewrite.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.assets }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum pg3d-rewrite-* | tee SHA256SUMS
      - uses: actions/attest@v4
        with:
          subject-checksums: SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" pg3d-rewrite-* SHA256SUMS --repo "$REPO" --clobber
          else
            gh release create "$TAG" pg3d-rewrite-* SHA256SUMS --repo "$REPO" --title "pg3d-rewrite $TAG" --generate-notes
          fi
